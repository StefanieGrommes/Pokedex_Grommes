<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./style templates/fonts.css">
    <link rel="stylesheet" href="./style templates/types.css">
     <link rel="shortcut icon" href="./assets/images/tumisu-pokemon-1530315_640.png" type="image/x-icon">
    
    <title>Pokedex</title>
</head>
<body onload="init()">
    <header>
        <div class="headline-and-logo">
            <h1 class="pokedex-main-headline">POKEDEX</h1>
            <div class="logo-wrapper">
                <img src="./assets/images/tumisu-pokemon-1530315_640.png" class="pokedex-logo" alt="logo">
            </div>
        </div>
        <div class="search-pokemon-section">
            <input type="text" class="input-search-pokemon" name="pokemonName" id="pokemonName" data-id="search-input" placeholder="write your Pokemon here!" minlength="3" required>
            <button onclick="searchPokemon()" class="loading-btn" >Load Pokemon</button>
            <p id="error-no-pokemon-found" style="display:none"><b>ERROR:</b><br>No Pokemon found!</p>
        </div>
    </header>
    
    <main data-id="content">

        <div id="error-message" class="error-wrapper" data-id="not-found">
            
        </div>

        

        <div class="pokemon-thumbnails-content" id="pokemon-thumbnails-content">
            
        </div>

        <div id="loading-container" class="laoding-container">
            <img src="./assets/images/ekkant-loader-9342.gif" id="loading-spinner" alt="loading spinner" class="loading-spinner"></img>
        </div>
    
        <dialog data-id="dialog" id="pokemon-dialog" closedby="any">
           
            
            <div id="pokemon-dialog-content" data-id="overlay-pokemon-name" aria-controls="pokemon-dialog" class="pokemon-big-card">
            
            </div>
        </dialog>
        

        <div id="load-more-section">
            <button data-id="load-more-button" id="loading-more-pokemons" class="loading-btn more-pokemon-btn" onclick="loadMorePokemons()">Load more Pokemons</button>
        </div>
    </main>

</body>
<script src="./script.js"></script>
</html>
