<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./style templates/fonts.css">
    <link rel="stylesheet" href="./style templates/types.css">
     <link rel="shortcut icon" href="./assets/images/tumisu-pokemon-1530315_640.png" type="image/x-icon">
    
    <title>Pokedex</title>
</head>
<body onload="init()">
    <header>
        <div class="headline-and-logo">
            <h1 class="pokedex-main-headline">POKEDEX</h1>
            <div class="logo-wrapper">
                <img src="./assets/images/tumisu-pokemon-1530315_640.png" class="pokedex-logo" alt="logo">
            </div>
        </div>
        <div class="search-pokemon-section">
            <input type="text" class="input-search-pokemon" name="pokemonName" id="pokemonName" data-id="search-button" placeholder="write your Pokemon here!" minlength="3" required>
            <button onclick="searchPokemon()" class="loading-btn" >Load Pokemon</button>
        </div>
    </header>
    
    <main data-id="content">

        <div id="error-message" class="error-wrapper">
            
        </div>
        
        <div class="pokemon-thumbnails-content" id="pokemon-thumbnails-content">
            <img src="./assets/images/ekkant-loader-9342.gif" id="loading-spinner" alt="loading spinner" class="loading-spinner">
        </div>

    
        <dialog class="open_dialog closed_dialog" data-id="dialog" id="pokemon-dialog" class="pokemon-big-card" aria-describedby="dialog_description" closedby="any"> 
            
            <div id="pokemon-dialog-content" aria-controls="pokemon-dialog" class="pokemon-big-card">
            
            </div>
        </dialog>

        <div id="load-more-section">
            <button data-id="load-more-button" id="loading-more-pokemons" class="loading-btn more-pokemon-btn" onclick="loadMorePokemons()">Load more Pokemons</button>
        </div>
    </main>

</body>
<script src="./script.js"></script>
</html>
